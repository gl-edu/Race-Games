<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Juego del Castillo de los Aztecas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#e9ddc0;
    --cream-2:#ddcda4;
    --ink:#241c14;
    --ink-soft:#463b2c;
    --oxblood:#8c3623;
    --oxblood-2:#6e2a1a;
    --gold:#b9902f;
    --gold-2:#8a6a1f;
    --jade:#2f6b52;
    --turquoise:#2f8f8a;
    --obsidian:#161311;
    --paper-shadow: rgba(36,28,20,0.35);
    --cell: 44px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #f3e9cc 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #d9c795 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:920px;
    margin:0 auto;
    padding:18px 14px 60px;
  }

  /* ---------- Header ---------- */
  .masthead{
    text-align:center;
    padding:10px 0 6px;
    border-bottom:3px double var(--ink);
    margin-bottom:6px;
    position:relative;
  }
  .masthead h1{
    font-family:'Cinzel Decorative', serif;
    font-weight:900;
    font-size:clamp(1.3rem, 4.4vw, 2.05rem);
    letter-spacing:0.02em;
    margin:0 0 2px;
    color:var(--ink);
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
  }
  .masthead .sub{
    font-family:'IM Fell English SC', serif;
    letter-spacing:0.14em;
    font-size:clamp(0.62rem, 2vw, 0.82rem);
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .masthead .rule{
    height:1px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 10px);
    margin:8px auto 0;
    max-width:520px;
    opacity:0.55;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family:'IM Fell English SC', serif;
    letter-spacing:0.05em;
    cursor:pointer;
    border:none;
    border-radius:3px;
  }
  .btn{
    background:var(--ink);
    color:var(--cream);
    padding:10px 20px;
    font-size:1rem;
    border:1px solid var(--ink);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
    transition: transform 0.08s ease;
  }
  .btn:hover{background:var(--ink-soft);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{
    background:var(--oxblood);
    border-color:var(--oxblood-2);
  }
  .btn.primary:hover{background:var(--oxblood-2);}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink-soft);
    box-shadow:none;
  }
  .btn.ghost:hover{background:rgba(36,28,20,0.08);}
  .btn:focus-visible, .sq:focus-visible, summary:focus-visible, input:focus-visible{
    outline:3px solid var(--turquoise);
    outline-offset:2px;
  }
  .btn[disabled]{opacity:0.45; cursor:not-allowed;}

  /* ---------- Intro screen ---------- */
  .card{
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    border:1px solid rgba(36,28,20,0.25);
    border-radius:6px;
    padding:20px;
    box-shadow: 0 3px 10px rgba(36,28,20,0.12);
  }
  .intro p{line-height:1.55; font-size:1.05rem;}
  .intro .roles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:18px 0;
  }
  @media (max-width:520px){ .intro .roles{grid-template-columns:1fr;} }
  .role-box{
    border:1px solid rgba(36,28,20,0.3);
    border-radius:6px;
    padding:14px;
    background:rgba(255,255,255,0.3);
  }
  .role-box h3{
    font-family:'IM Fell English SC', serif;
    margin:0 0 6px;
    font-size:1.15rem;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .role-dot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none;}
  .role-dot.att{background:var(--oxblood); border:2px solid var(--cream-2);}
  .role-dot.def{background:var(--obsidian); border:2px solid var(--gold);}
  .role-box p{margin:0; font-size:0.95rem; color:var(--ink-soft);}
  .name-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;}
  .name-row label{font-size:0.85rem; color:var(--ink-soft); display:block; margin-bottom:3px;}
  .name-row input{
    font-family:'EB Garamond', serif;
    font-size:1rem;
    padding:7px 9px;
    border:1px solid var(--ink-soft);
    border-radius:4px;
    background:rgba(255,255,255,0.6);
    width:100%;
  }
  .intro-actions{text-align:center; margin-top:16px;}

  /* ---------- Status bar ---------- */
  .statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin:14px 0 10px;
    padding:10px 14px;
    background:rgba(36,28,20,0.06);
    border-radius:6px;
    border:1px solid rgba(36,28,20,0.15);
  }
  .turn-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IM Fell English SC', serif;
    font-size:1.05rem;
  }
  .turn-pill .role-dot{width:14px;height:14px;}
  .status-msg{
    font-size:0.92rem;
    color:var(--oxblood-2);
    font-style:italic;
    min-height:1.3em;
  }
  .tally{
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  /* ---------- Board: real photo background + fractional overlay ---------- */
  .board-scroll{
    padding:22px 4px 30px;
  }
  .board-frame{
    position:relative;
    margin:0 auto;
    max-width:900px;
  }
  #boardPhotoWrap{
    position:relative;
    width:100%;
    line-height:0;
    border-radius:4px;
    box-shadow: 0 6px 18px rgba(36,28,20,0.35);
    border:1px solid rgba(36,28,20,0.35);
    overflow:hidden;
  }
  #boardPhotoWrap img{
    display:block;
    width:100%;
    height:auto;
  }

  .sq{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
  }
  .sq.playable{cursor:pointer;}
  .sq.legal-dest::after{
    content:"";
    width:32%;
    height:32%;
    border-radius:50%;
    background:var(--turquoise);
    opacity:0.85;
    box-shadow:0 0 0 3px rgba(47,143,138,0.28);
  }
  .sq.legal-capture::after{
    content:"";
    width:42%;
    height:42%;
    border-radius:50%;
    background:transparent;
    border:3px solid var(--turquoise);
    box-shadow:0 0 0 3px rgba(47,143,138,0.28);
  }
  .sq.selected{
    box-shadow: inset 0 0 0 3px var(--turquoise);
    border-radius:4px;
  }

  .piece{
    width:62%;
    height:62%;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow: 0 2px 3px rgba(0,0,0,0.45), inset 0 2px 3px rgba(255,255,255,0.15);
  }
  .piece.attacker{
    background: radial-gradient(circle at 35% 30%, #b1552f, var(--oxblood) 60%, var(--oxblood-2) 100%);
    border:2px solid var(--cream-2);
  }
  .piece.defender{
    background: radial-gradient(circle at 35% 30%, #34291f, var(--obsidian) 65%, #0c0a08 100%);
    border:2px solid var(--gold);
  }
  .piece svg{width:52%; height:52%; opacity:0.9;}
  .piece.can-capture{
    box-shadow: 0 0 0 3px var(--gold), 0 2px 3px rgba(0,0,0,0.45);
  }
  @media (prefers-reduced-motion: no-preference){
    .piece.can-capture{ animation: pulseGold 1.6s ease-in-out infinite; }
  }
  @keyframes pulseGold{
    0%,100%{ box-shadow: 0 0 0 2px var(--gold), 0 2px 3px rgba(0,0,0,0.45); }
    50%{ box-shadow: 0 0 0 5px rgba(185,144,47,0.55), 0 2px 3px rgba(0,0,0,0.45); }
  }

  .placement-hint{
    text-align:center;
    font-family:'IM Fell English SC', serif;
    font-size:0.95rem;
    color:var(--ink-soft);
    margin:2px 0 0;
  }
  .placement-actions{
    display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;
  }

  /* ---------- Rules panel ---------- */
  details.rules{
    margin-top:20px;
    border:1px solid rgba(36,28,20,0.25);
    border-radius:6px;
    background:rgba(255,255,255,0.28);
    overflow:hidden;
  }
  details.rules summary{
    font-family:'IM Fell English SC', serif;
    font-size:1.05rem;
    padding:12px 16px;
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  details.rules summary::-webkit-details-marker{display:none;}
  details.rules summary::after{
    content:"\2795";
    font-size:0.75rem;
    color:var(--ink-soft);
  }
  details.rules[open] summary::after{content:"\2796";}
  .rules-body{
    padding:4px 18px 18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media (max-width:640px){ .rules-body{grid-template-columns:1fr;} }
  .rules-col h4{
    font-family:'IM Fell English SC', serif;
    margin:0 0 6px;
    color:var(--oxblood-2);
    font-size:0.95rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .rules-col p{
    font-size:0.95rem;
    line-height:1.5;
    margin:0 0 10px;
  }
  .rules-col.original p{ font-style:italic; }

  /* ---------- Win overlay ---------- */
  .win-overlay{
    position:fixed; inset:0;
    background:rgba(22,17,12,0.72);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .win-card{
    background:var(--cream);
    border:4px double var(--ink);
    border-radius:8px;
    padding:28px 26px;
    max-width:420px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  .win-card h2{
    font-family:'Cinzel Decorative', serif;
    font-size:1.5rem;
    margin:0 0 10px;
  }
  .win-card p{font-size:1rem; line-height:1.5; color:var(--ink-soft);}
  .hidden{display:none !important;}

  footer.credits{
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
    opacity:0.7;
    margin-top:26px;
  }
</style>
</head>

let squares = {};   // id -> {id,row,col,absX,isBlack}
let posIndex = {};  // "row_key" -> id  (key = round(absX*2))

function buildBoard(){
  squares = {}; posIndex = {};
  for (let r=0; r<NUM_ROWS; r++){
    const w = ROW_WIDTHS[r];
    const offset = (MAX_WIDTH - w) / 2;
    for (let c=0; c<w; c++){
      const isBlack = ROW_START_BLACK[r] ? (c % 2 === 0) : (c % 2 === 1);
      const absX = offset + c + 0.5;
      const id = r + '_' + c;
      squares[id] = { id, row:r, col:c, absX, isBlack };
      if (isBlack) posIndex[r + '_' + Math.round(absX*2)] = id;
    }
  }
}

function findByPos(row, absX){
  const id = posIndex[row + '_' + Math.round(absX*2)];
  return id ? squares[id] : null;
}
function stepNeighbor(sq, dir){ return findByPos(sq.row+dir[0], sq.absX+dir[1]); }
function jumpLanding(sq, dir){ return findByPos(sq.row+2*dir[0], sq.absX+2*dir[1]); }

/* ===================== Game state ===================== */
let pieces = {};           // squareId -> 'attacker' | 'defender'
let placedDefenders = [];  // squareIds chosen during placement

const state = {
  phase: 'intro',          // intro | placement | playing | gameover
  turn: 'attacker',
  selected: null,
  mustContinueWith: null,
  capturedAttackers: 0,
  winner: null,
  statusMsg: '',
  attackerName: 'Atacantes',
  defenderName: 'Aztecas',
  cell: 44
};

function resetGame(){
  buildBoard();
  pieces = {};
  placedDefenders = [];
  for (const id in squares){
    const sq = squares[id];
    if (sq.isBlack && CAMP_ROWS.includes(sq.row)) pieces[id] = 'attacker';
  }
  state.phase = 'placement';
  state.turn = 'attacker';
  state.selected = null;
  state.mustContinueWith = null;
  state.capturedAttackers = 0;
  state.winner = null;
  state.statusMsg = 'Coloca a tus 3 defensores en las casillas negras del castillo.';
  render();
}

/* ===================== Move generation ===================== */
function attackerLegalMoves(sqId){
  const sq = squares[sqId];
  const moves = [];
  for (const dir of [[-1,-1],[-1,1]]){
    const n = stepNeighbor(sq, dir);
    if (n && !pieces[n.id]) moves.push({ to:n.id, capture:null });
  }
  return moves;
}

function defenderMovesForPiece(sqId){
  const sq = squares[sqId];
  const simple = [], captures = [];
  for (const dir of DIRS){
    const n = stepNeighbor(sq, dir);
    if (!n) continue;
    if (!pieces[n.id]){
      simple.push({ to:n.id, capture:null });
    } else if (pieces[n.id] === 'attacker'){
      const land = jumpLanding(sq, dir);
      if (land && !pieces[land.id]) captures.push({ to:land.id, capture:n.id });
    }
  }
  return { simple, captures };
}

function anyDefenderHasCapture(){
  for (const id in pieces){
    if (pieces[id] === 'defender' && defenderMovesForPiece(id).captures.length > 0) return true;
  }
  return false;
}
function defendersWithCaptures(){
  return Object.keys(pieces).filter(id => pieces[id]==='defender' && defenderMovesForPiece(id).captures.length>0);
}
function attackerHasAnyMove(){
  for (const id in pieces){
    if (pieces[id] === 'attacker' && attackerLegalMoves(id).length > 0) return true;
  }
  return false;
}
function defenderHasAnyMove(){
  for (const id in pieces){
    if (pieces[id] === 'defender'){
      const { simple, captures } = defenderMovesForPiece(id);
      if (simple.length || captures.length) return true;
    }
  }
  return false;
}

function currentLegalDestinations(){
  if (!state.selected) return [];
  const type = pieces[state.selected];
  if (type === 'attacker'){
    return attackerLegalMoves(state.selected).map(m => ({ id:m.to, capture:false }));
  }
  const { simple, captures } = defenderMovesForPiece(state.selected);
  if (state.mustContinueWith) return captures.map(m => ({ id:m.to, capture:true }));
  const mustCapture = anyDefenderHasCapture();
  const pool = mustCapture ? captures : simple.concat(captures);
  return pool.map(m => ({ id:m.to, capture: !!m.capture }));
}

/* ===================== Win checks ===================== */
function castleFullyTaken(){
  return Object.values(squares).every(sq => {
    if (!sq.isBlack || !CASTLE_ROWS.includes(sq.row)) return true;
    return pieces[sq.id] === 'attacker';
  });
}
function declareWinner(side){
  state.phase = 'gameover';
  state.winner = side;
  state.selected = null;
  state.mustContinueWith = null;
  render();
}

/* ===================== Interaction ===================== */
function handlePlacementClick(id){
  const sq = squares[id];
  if (!sq || !sq.isBlack || !CASTLE_ROWS.includes(sq.row)) return;
  if (pieces[id] === 'defender'){
    delete pieces[id];
    placedDefenders = placedDefenders.filter(x => x !== id);
    state.statusMsg = 'Coloca a tus 3 defensores en las casillas negras del castillo.';
    render();
    return;
  }
  if (pieces[id]) return;
  if (placedDefenders.length >= 3) return;
  pieces[id] = 'defender';
  placedDefenders.push(id);
  state.statusMsg = placedDefenders.length === 3
    ? 'Defensores listos. Pulsa "Comenzar la partida".'
    : `Coloca ${3 - placedDefenders.length} defensor(es) mas.`;
  render();
}

function useDefaultPlacement(){
  for (const id of placedDefenders) delete pieces[id];
  placedDefenders = [];
  const row2 = Object.values(squares).filter(s => s.isBlack && s.row === 2).sort((a,b)=>a.absX-b.absX);
  for (const s of row2){ pieces[s.id] = 'defender'; placedDefenders.push(s.id); }
  state.statusMsg = 'Defensores listos. Pulsa "Comenzar la partida".';
  render();
}

function beginPlaying(){
  if (placedDefenders.length !== 3) return;
  state.phase = 'playing';
  state.turn = 'attacker';
  state.statusMsg = '';
  render();
}

function selectSquare(id){
  if (state.phase === 'placement'){ handlePlacementClick(id); return; }
  if (state.phase !== 'playing') return;
  const sq = squares[id];
  if (!sq || !sq.isBlack) return;

  const occ = pieces[id];

  if (state.mustContinueWith){
    if (id === state.mustContinueWith) return;
    tryMoveTo(state.mustContinueWith, id);
    return;
  }

  if (occ === state.turn){
    if (state.turn === 'defender'){
      const forced = defendersWithCaptures();
      if (forced.length > 0 && !forced.includes(id)){
        state.statusMsg = 'Hay una pieza que puede comer: debes mover esa.';
        render();
        return;
      }
    }
    state.selected = (state.selected === id) ? null : id;
    state.statusMsg = '';
    render();
    return;
  }

  if (state.selected){
    tryMoveTo(state.selected, id);
  }
}

function tryMoveTo(fromId, toId){
  const type = pieces[fromId];
  if (type === 'attacker'){
    const move = attackerLegalMoves(fromId).find(m => m.to === toId);
    if (!move) return;
    delete pieces[fromId];
    pieces[toId] = 'attacker';
    state.selected = null;
    afterAttackerMove();
    return;
  }

  const { simple, captures } = defenderMovesForPiece(fromId);
  const mustCapture = state.mustContinueWith ? true : anyDefenderHasCapture();
  const pool = mustCapture ? captures : simple.concat(captures);
  const move = pool.find(m => m.to === toId);
  if (!move) return;

  delete pieces[fromId];
  pieces[toId] = 'defender';
  const wasCapture = !!move.capture;
  if (wasCapture){
    delete pieces[move.capture];
    state.capturedAttackers++;
  }

  if (wasCapture){
    const next = defenderMovesForPiece(toId).captures;
    if (next.length > 0){
      state.mustContinueWith = toId;
      state.selected = toId;
      state.statusMsg = 'Debes seguir capturando con la misma pieza.';
      render();
      return;
    }
  }

  state.selected = null;
  state.mustContinueWith = null;
  afterDefenderMove();
}

function afterAttackerMove(){
  if (castleFullyTaken()){ declareWinner('attacker'); return; }
  state.turn = 'defender';
  state.statusMsg = '';
  if (!defenderHasAnyMove()){
    state.turn = 'attacker';
    state.statusMsg = 'Los defensores no tienen movimiento posible: pasan turno.';
  }
  render();
}

function afterDefenderMove(){
  state.turn = 'attacker';
  state.statusMsg = '';
  if (!attackerHasAnyMove()){ declareWinner('defender'); return; }
  render();
}

/* ===================== Rendering ===================== */
function svgFor(type){
  if (type === 'defender'){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#c9a227" stroke-width="1.6"><path d="M12 2 L14 9 L12 8 L10 9 Z" fill="#c9a227" stroke="none"/><circle cx="12" cy="15" r="4.2"/></svg>';
  }
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#ecd9b9" stroke-width="1.8"><path d="M12 4 L12 20 M7 9 L17 9" stroke-linecap="round"/></svg>';
}

function renderApp(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="masthead">
      <h1>Juego del Castillo de los Aztecas</h1>
      <div class="sub">Un asalto al estilo del siglo XIX</div>
      <div class="rule"></div>
    </header>
    <div id="screen"></div>
    <div id="rulespanel"></div>
    <footer class="credits">Adaptado de un impreso original del siglo XIX &mdash; &laquo;De venta en La Perla, Seminario, 3&raquo;</footer>
  `;
  renderRulesPanel();
  renderScreen();
}

function renderScreen(){
  const el = document.getElementById('screen');
  if (state.phase === 'intro'){
    el.innerHTML = introHTML();
    document.getElementById('start-btn').addEventListener('click', () => {
      const a = document.getElementById('att-name').value.trim();
      const d = document.getElementById('def-name').value.trim();
      if (a) state.attackerName = a;
      if (d) state.defenderName = d;
      resetGame();
    });
    return;
  }
  el.innerHTML = gameHTML();
  bindBoardEvents();
  if (state.phase === 'placement'){
    document.getElementById('default-btn').addEventListener('click', useDefaultPlacement);
    document.getElementById('begin-btn').addEventListener('click', beginPlaying);
  }
  if (state.phase === 'gameover'){
    const restartBtn2 = document.getElementById('restart-btn-2');
    if (restartBtn2) restartBtn2.addEventListener('click', resetGame);
  }
}

function introHTML(){
  return `
    <div class="card intro">
      <p>El castillo esta guardado por tres Aztecas. Los soldados atacantes se lanzan al asalto para
      desalojarlos y ocupar sus ocho casas. Los defensores se mueven y comen en cualquier direccion, como en
      las damas; los atacantes solo avanzan, casilla a casilla, y jamas pueden comer &mdash; pero pueden
      obligar a un defensor a hacerlo.</p>
      <div class="roles">
        <div class="role-box">
          <h3><span class="role-dot att"></span> Atacantes</h3>
          <p>21 piezas. Avanzan en diagonal hacia el castillo. Ganan si ocupan las 8 casas del castillo.</p>
          <div class="name-row">
            <label for="att-name">Nombre del jugador</label>
            <input id="att-name" type="text" placeholder="Atacantes" maxlength="20">
          </div>
        </div>
        <div class="role-box">
          <h3><span class="role-dot def"></span> Defensores</h3>
          <p>3 piezas. Se mueven y comen en cualquier direccion. Ganan si dejan a los atacantes sin movimiento.</p>
          <div class="name-row">
            <label for="def-name">Nombre del jugador</label>
            <input id="def-name" type="text" placeholder="Aztecas" maxlength="20">
          </div>
        </div>
      </div>
      <div class="intro-actions">
        <button class="btn primary" id="start-btn">Comenzar</button>
      </div>
    </div>
  `;
}

function statusBarHTML(){
  let turnLabel, dotClass;
  if (state.phase === 'placement'){
    turnLabel = `${state.defenderName} colocando defensores`;
    dotClass = 'def';
  } else if (state.phase === 'gameover'){
    turnLabel = 'Partida terminada';
    dotClass = state.winner === 'attacker' ? 'att' : 'def';
  } else {
    turnLabel = state.turn === 'attacker' ? `Turno: ${state.attackerName}` : `Turno: ${state.defenderName}`;
    dotClass = state.turn === 'attacker' ? 'att' : 'def';
  }
  return `
    <div class="statusbar">
      <span class="turn-pill"><span class="role-dot ${dotClass}"></span>${turnLabel}</span>
      <span class="status-msg">${state.statusMsg || ''}</span>
      <span class="tally">Atacantes capturados: ${state.capturedAttackers}</span>
    </div>
  `;
}

function gameHTML(){
  return `
    ${statusBarHTML()}
    ${state.phase === 'placement' ? `
      <p class="placement-hint">Haz clic en las casillas negras del castillo para colocar a tus 3 defensores (${placedDefenders.length}/3).</p>
      <div class="placement-actions">
        <button class="btn ghost" id="default-btn">Colocacion sugerida</button>
        <button class="btn primary" id="begin-btn" ${placedDefenders.length===3?'':'disabled'}>Comenzar la partida</button>
      </div>
    ` : ''}
    <div class="board-scroll" id="board-scroll">
      <div class="board-frame" id="board-frame"></div>
    </div>
    ${state.phase === 'gameover' ? winOverlayHTML() : ''}
  `;
}

function winOverlayHTML(){
  const attackerWon = state.winner === 'attacker';
  const title = attackerWon ? 'Los atacantes toman el castillo' : 'Los defensores resisten el asalto';
  const msg = attackerWon
    ? `${state.attackerName} han ocupado las ocho casas del castillo. ${state.defenderName} no lograron defenderlo.`
    : `${state.defenderName} han dejado sin movimiento a ${state.attackerName}. El castillo permanece a salvo.`;
  return `
    <div class="win-overlay">
      <div class="win-card">
        <h2>${title}</h2>
        <p>${msg}</p>
        <button class="btn primary" id="restart-btn-2">Jugar de nuevo</button>
      </div>
    </div>
  `;
}

function renderRulesPanel(){
  const el = document.getElementById('rulespanel');
  el.innerHTML = `
    <details class="rules">
      <summary>Reglas originales &amp; resumen en ingles</summary>
      <div class="rules-body">
        <div class="rules-col original">
          <h4>Modo de jugarlo (original)</h4>
          <p>Se juega con 24 fichas o soldados, 3 de un color y 21 de otro. Los 3 defienden el castillo o
          parte superior, resguardada por los Aztecas y el Aguila, y los otros 21 lo atacan, colocandose en
          las 3 lineas de casillas negras de abajo, siendo su movimiento de avance para arriba por las casillas
          negras, para desalojar a los tres defensores del castillo y ocupar sus ocho casas, con lo que
          ganaran el juego.</p>
          <p>Los asaltantes no pueden comer, pero si obligar a los defensores a que coman. Los defensores se
          colocaran en las tres casillas negras que estan entre los Aztecas, y pueden andar y comer de todos
          lados, pero solamente una pieza en cada jugada, siempre que esta tenga atras una casilla vacia,
          ganando el juego cuando dejen sin jugada a los contrarios.</p>
        </div>
        <div class="rules-col">
          <h4>English summary</h4>
          <p>The original: 24 pieces, 3 defenders guarding the castle against 21 attackers starting on the
          bottom three rows of black squares.</p>
          <p>Attackers move one step diagonally forward only, and can never capture. Defenders move
          diagonally in any direction and capture by jumping, exactly like checkers &mdash; and must capture
          when a capture is available.</p>
          <p>Attackers win by clearing the defenders out and occupying all 8 castle squares. Defenders win
          by leaving the attackers with no legal move anywhere on the board.</p>
          <p style="opacity:0.75; font-size:0.85rem;">The board itself is a photograph of the real object,
          perspective-corrected, with 21 attacker squares across the bottom three rows and 8 castle squares
          &mdash; both counted directly from the photo. The defenders' starting squares and multi-jump
          chaining were reconstructed, since the rules text leaves those open, drawing on the wider Asalto /
          Fox-and-Geese family this game belongs to.</p>
        </div>
      </div>
    </details>
  `;
}

/* ---------- Board drawing: real photo background + fractional-coordinate overlay ---------- */
function renderBoard(){
  const frame = document.getElementById('board-frame');
  if (!frame) return;

  const legal = currentLegalDestinations();
  const legalMap = {};
  legal.forEach(l => legalMap[l.id] = l.capture);
  const forced = state.phase === 'playing' && state.turn === 'defender' ? defendersWithCaptures() : [];

  let html = `<div id="boardPhotoWrap">`;
  html += `<img id="board-photo-img" src="${window.__ASSETS__.boardPhoto}" alt="Tablero original fotografiado del Juego del Castillo de los Aztecas">`;

  for (const id in squares){
    const sq = squares[id];
    if (!sq.isBlack) continue;
    const coord = SQUARE_COORDS[id];
    if (!coord) continue;
    const classes = ['sq', 'playable'];
    if (state.selected === id) classes.push('selected');
    if (id in legalMap) classes.push(legalMap[id] ? 'legal-capture' : 'legal-dest');
    let inner = '';
    const occ = pieces[id];
    if (occ){
      const pClasses = ['piece', occ];
      if (occ === 'defender' && forced.includes(id)) pClasses.push('can-capture');
      inner = `<div class="${pClasses.join(' ')}">${svgFor(occ)}</div>`;
    }
    html += `<div class="${classes.join(' ')}" data-id="${id}" data-xf="${coord.xf}" data-yf="${coord.yf}" data-wf="${coord.wf}" data-hf="${coord.hf}">${inner}</div>`;
  }
  html += `</div>`;
  frame.innerHTML = html;

  const img = document.getElementById('board-photo-img');
  if (img.complete && img.naturalWidth){
    layoutSpaces();
  }
  img.addEventListener('load', layoutSpaces);
}

function layoutSpaces(){
  const wrap = document.getElementById('boardPhotoWrap');
  const img = document.getElementById('board-photo-img');
  if (!wrap || !img) return;
  const w = img.offsetWidth;
  const h = img.offsetHeight;
  if (!w || !h) return;
  wrap.querySelectorAll('.sq').forEach(el => {
    const xf = parseFloat(el.dataset.xf), yf = parseFloat(el.dataset.yf);
    const wf = parseFloat(el.dataset.wf), hf = parseFloat(el.dataset.hf);
    const sw = wf * w, sh = hf * h;
    el.style.left = (xf * w - sw / 2) + 'px';
    el.style.top = (yf * h - sh / 2) + 'px';
    el.style.width = sw + 'px';
    el.style.height = sh + 'px';
  });
}

function bindBoardEvents(){
  const frame = document.getElementById('board-frame');
  renderBoard();
  frame.addEventListener('click', (e) => {
    const target = e.target.closest('.sq');
    if (!target) return;
    selectSquare(target.getAttribute('data-id'));
  });
  window.addEventListener('resize', debounce(() => layoutSpaces(), 120));
}

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function render(){
  const screenExists = document.getElementById('screen');
  if (!screenExists){ renderApp(); return; }
  renderScreen();
}

/* ===================== Boot ===================== */
document.addEventListener('DOMContentLoaded', () => {
  buildBoard();
  renderApp();
});

</script>

<script>
(function(){
  var lightbox = document.getElementById('rg-lightbox');
  var lightboxImg = document.getElementById('rg-lightbox-img');
  document.querySelectorAll('.rg-photo-grid img').forEach(function(img){
    img.addEventListener('click', function(){
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    });
  });
  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';

  lightbox.querySelectorAll('[data-rg-close]').forEach(function(el){

  });
})();
